# Example configuration for a Shelly Plug S used as an Internet watchdog.
# GPIO assignments are for Shelly Plug S Gen1 (ESP8266).

substitutions:
  devicename: internet-watchdog

esphome:
  name: ${devicename}
  friendly_name: Internet Watchdog

esp8266:
  board: esp8285

external_components:
  - source: github://sm0vph/esphome-watchdog@main
    components: [internet_watchdog]

logger:

api:

ota:
  - platform: web_server

web_server:

wifi:
  ssid: "YOUR_WIFI"
  password: "YOUR_PASSWORD"

captive_portal:

time:
  - platform: sntp

internet_watchdog:
  id: watchdog

  relay: relay

  dns_servers:
    - 1.1.1.1
    - 8.8.8.8
    - 9.9.9.9
  check_domain: example.com
  dns_timeout: 2s

  startup_grace_time: 180s
  power_off_time: 20s
  boot_wait_time: 180s

  reboot_backoff: true
  reboot_backoff_initial: 1min
  reboot_backoff_max: 6h
  reboot_backoff_multiplier: 3

  check_interval: 2min
  failure_threshold: 2
  network_connect_timeout: 7min
  device_reboot_before_power_cycle: true

  maintenance_switch: maintenance_switch
  maintenance_timeout: 1h

  status:
    name: Watchdog Status

  latency:
    name: Latency

  current_target:
    name: Current Target

  last_failure:
    name: Last Failure

  internet_ok:
    name: Internet OK

  restart_count:
    name: Restart Count

button:
  - platform: template
    name: Restart modem
    icon: mdi:restart
    on_press:
      - script.execute: power_cycle

binary_sensor:
  - platform: gpio
    id: device_button
    name: Device button
    pin:
      number: GPIO13
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_click:
      - min_length: 50ms
        max_length: 999ms
        then:
          - switch.toggle: maintenance_switch
      - min_length: 1s
        max_length: 10s
        then:
          - script.execute: power_cycle

script:
  - id: power_cycle
    mode: restart
    then:
      - switch.turn_off: relay
      - delay: 20s
      - switch.turn_on: relay

status_led:
  pin:
    number: GPIO2
    inverted: true

output:
  - platform: gpio
    id: red_status_led
    pin: GPIO0
    inverted: true

switch:
  - platform: gpio
    id: relay
    name: Relay
    pin: GPIO15
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: maintenance_switch
    name: Maintenance mode
    optimistic: true
    on_turn_on:
      - output.turn_on: red_status_led
    on_turn_off:
      - output.turn_off: red_status_led
